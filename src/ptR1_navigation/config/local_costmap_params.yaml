local_costmap:
  # global_frame: คือกรอบอ้างอิงที่ต่อเนื่องและไม่มีการกระโดด ปกติคือ "odom" เพื่อให้การหลบหลีกราบรื่น
  global_frame: odom
  robot_base_frame: base_link
  
  # update_frequency: ความถี่ในการอัปเดต costmap (Hz) สำหรับ local ต้องสูงเพื่อตอบสนองต่อสิ่งกีดขวางได้เร็ว
  update_frequency: 5.0
  publish_frequency: 2.0
  
  # transform_tolerance: ความอดทนในการรอข้อมูล TF
  transform_tolerance: 1.0
  
  # rolling_window: true หมายถึง costmap จะมีขนาดเล็กและ "เคลื่อนที่" ตามหุ่นยนต์ไปตลอดเวลา
  rolling_window: true
  width: 2.5              # ความกว้างของหน้าต่าง costmap ที่เคลื่อนที่ (เมตร)
  height: 2.5             # ความสูงของหน้าต่าง costmap ที่เคลื่อนที่ (เมตร)
  resolution: 0.05        # ความละเอียดของ costmap ควรตั้งให้ตรงกับ global_costmap

  # plugins: รายการเลเยอร์ (สังเกตว่าจะไม่มี static_layer เพราะ local costmap ไม่สนใจแผนที่นิ่งๆ ทั้งหมด)
  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # inflation_layer: ตั้งค่า inflation เฉพาะสำหรับ local costmap
  # inflation_radius: คือขนาดของระยะกันชน (เมตร) สำหรับ local มักจะตั้งให้เล็กกว่า global เพื่อให้หุ่นยนต์ "กล้า" ที่จะเข้าที่แคบได้
  inflation_layer:
    inflation_radius: 0.15