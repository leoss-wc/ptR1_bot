global_costmap:
  # global_frame: คือกรอบอ้างอิงหลักของโลกที่ไม่เคลื่อนที่ ปกติคือ "map"
  global_frame: map
  # robot_base_frame: คือกรอบอ้างอิงที่ติดอยู่กับจุดศูนย์กลางของหุ่นยนต์ ปกติคือ "base_link"
  robot_base_frame: base_link
  
  # update_frequency: ความถี่ในการอัปเดต costmap (Hz) สำหรับ global ไม่ต้องบ่อยมาก
  update_frequency: 1.0
  # publish_frequency: ความถี่ในการส่งข้อมูล costmap ออกไปให้ RViz แสดงผล (Hz)
  publish_frequency: 1.0
  
  # transform_tolerance: คือ "ความอดทน" ของ costmap ในการรอข้อมูล TF ที่อาจจะมาช้า (วินาที)
  transform_tolerance: 1.0
  
  # rolling_window: false หมายถึง costmap จะมีขนาดใหญ่ครอบคลุมแผนที่ทั้งหมดและไม่เคลื่อนที่ตามหุ่นยนต์
  rolling_window: false

  # plugins: รายการเลเยอร์ที่จะใช้สร้าง costmap นี้ขึ้นมา
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}      # เลเยอร์สำหรับแผนที่นิ่งๆ ที่สร้างไว้ล่วงหน้า
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}    # เลเยอร์สำหรับสิ่งกีดขวางที่เจอแบบ real-time
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}   # เลเยอร์สำหรับสร้างระยะกันชน

  # static_layer: ตั้งค่าเฉพาะสำหรับ static layer
  static_layer:
    enabled: true           # เปิดใช้งาน
    map_topic: /map         # หัวข้อ (topic) ที่รับข้อมูลแผนที่มาจาก map_server

  # inflation_layer: ตั้งค่า inflation เฉพาะสำหรับ global costmap
  # inflation_radius: คือขนาดของระยะกันชน (เมตร) สำหรับ global มักจะตั้งให้ใหญ่หน่อยเพื่อให้วางแผนเส้นทางที่ปลอดภัยและดู "เผื่อ" ที่จะเลี้ยว
  inflation_layer:
    inflation_radius: 0.2