DWAPlannerROS:
  # --- 1. Robot Configuration Parameters ---
  holonomic_robot: true # ถ้าเป็นล้อ Mecanum ให้เปิด true เพื่อให้สไลด์ข้างได้ (พริ้วกว่า)
  
  # ความเร็ว
  max_vel_x: 0.4
  min_vel_x: -0.1      
  
  max_vel_y: 0.15     
  min_vel_y: -0.15

  max_vel_trans: 0.4  
  min_vel_trans: 0.0

  max_vel_theta: 0.4   # หมุนไม่เร็วไม่ช้าเกินไป
  min_vel_theta: 0.25

  # --- 2. Acceleration Limits  ---
  acc_lim_x: 0.5      
  acc_lim_y: 0.5
  acc_lim_theta: 0.5   

  # --- 3. Forward Simulation Parameters ---
  sim_time: 1.3      # จำลองเส้นทางล่วงหน้า 1.3 วินาที 
  vx_samples: 20
  vy_samples: 10
  vtheta_samples: 20
  sim_granularity: 0.05 # ละเอียดขึ้นนิดนึงเพื่อความแม่น

  # --- 4. Trajectory Scoring Parameters  ---
  path_distance_bias: 32.0       
  goal_distance_bias: 24.0     
  occdist_scale: 0.02           
  forward_point_distance: 0.325 
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  heading_scoring: true
  heading_scoring_timestep: 1.0
  penalize_negative_x: true

  # --- 5. Oscillation Prevention ---
  oscillation_reset_dist: 0.05

  # --- 6. Goal Tolerance (สำคัญมากสำหรับความ "ปกติ") ---
  xy_goal_tolerance: 0.30       # ยอมรับความคลาดเคลื่อน 10cm
  yaw_goal_tolerance: 0.4      # ยอมรับความคลาดเคลื่อน 8.5 องศา
  latch_xy_goal_tolerance: true # เมื่อเข้าใกล้เป้าหมายแล้วจะล็อคไว้ไม่ให้หลุดง่ายๆ

  # --- 7. Debugging ---
  publish_cost_grid_pc: true  # แนะนำเปิด True ไว้ดู cost grid ใน Rviz ว่าหุ่นคิดยังไงกับสิ่งกีดขวาง
  publish_traj_pc: true         # แนะนำเปิด True ไว้ดูเส้นทางใน Rviz ว่าหุ่นคิดจะไปไหน