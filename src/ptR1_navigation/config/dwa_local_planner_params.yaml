# พารามิเตอร์สำหรับ DWA Planner (TrajectoryPlannerROS)
TrajectoryPlannerROS:
  meter_scoring: true

  # === Robot Configuration Parameters ===
  #พารามิเตอร์ที่สำคัญที่สุดสำหรับล้อ Mecanum
  holonomic_robot: true

  # --- ข้อจำกัดด้านความเร็ว (Velocity Limits) ---
  max_vel_x: 0.5        # ความเร็วสูงสุดในแนวตรง (เมตร/วินาที)
  min_vel_x: -0.5       # ความเร็วถอยหลังสูงสุด
  
  max_vel_y: 0.5        # ความเร็วสูงสุดในแนวขวาง (เมตร/วินาที) - สำหรับ Mecanum
  min_vel_y: -0.5       # ความเร็วสูงสุดในแนวขวาง (อีกด้าน)

  max_trans_vel: 0.5    # ความเร็วเคลื่อนที่รวมสูงสุด (sqrt(vx^2 + vy^2))
  min_trans_vel: 0.1    # ความเร็วเคลื่อนที่รวมต่ำสุด

  max_rot_vel: 1.0      # ความเร็วในการหมุนสูงสุด (เรเดียน/วินาที)
  min_rot_vel: 0.2      # ความเร็วในการหมุนต่ำสุด

  # --- ข้อจำกัดด้านอัตราเร่ง (Acceleration Limits) ---
  acc_lim_x: 1.0        # อัตราเร่งสูงสุดในแนวตรง
  acc_lim_y: 1.0        # อัตราเร่งสูงสุดในแนวขวาง
  acc_lim_theta: 2.0    # อัตราเร่งในการหมุนสูงสุด

  # === Goal Tolerance Parameters ===
  xy_goal_tolerance: 0.15   # ระยะห่างจากเป้าหมายในแนวราบที่จะถือว่า "ถึงแล้ว" (เมตร)
  yaw_goal_tolerance: 0.1   # ค่าความคลาดเคลื่อนของมุมสุดท้ายที่จะถือว่า "ถึงแล้ว" (เรเดียน)

  # === Forward Simulation Parameters ===
  # DWA จะจำลองการเคลื่อนที่ไปข้างหน้าเป็นเวลาเท่านี้เพื่อหาเส้นทางที่ดีที่สุด
  sim_time: 1.5           # จำลองไปข้างหน้า 1.5 วินาที
  sim_granularity: 0.025  # ความละเอียดของจุดบนเส้นทางจำลอง
  
  # จำนวนตัวอย่างความเร็วที่จะใช้ในการจำลอง (ค่าสูงขึ้น = แม่นยำขึ้น แต่ใช้ CPU มากขึ้น)
  vx_samples: 10
  vy_samples: 10          # ต้องมีค่ามากกว่า 1 สำหรับหุ่นยนต์ Holonomic
  vtheta_samples: 20